<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Minimal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Critical above-the-fold CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f9f9f7;
            font-family: 'Inter Tight', sans-serif;
            color: #2a2a2a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f9f9f7;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 1.5rem;
            color: #8a8a8a;
        }
        .app {
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 100%;
            max-width: 600px;
        }
        .app.loaded {
            opacity: 1;
        }
        .error-banner {
            background-color: #d64545;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            display: none;
        }
        .error-banner.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading...</div>
    <div class="error-banner" id="errorBanner"></div>
    <div class="app" id="app">
        <!-- Content will be rendered by app.js -->
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
